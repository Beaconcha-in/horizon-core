name: Horizon Orchestrator
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          chmod +x orchestrator.sh
          ./orchestrator.sh
